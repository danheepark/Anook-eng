events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    # 1. HTTP → HTTPS 리다이렉트
    server {
        listen 80;
        server_name anoook.newlecture.com;
        return 301 https://$host$request_uri;
    }

    # 2. HTTPS 서버 설정
    server {
        listen 443 ssl;
        server_name anoook.newlecture.com;

        # SSL 인증서 경로 (docker-compose 볼륨 매핑 기준)
        ssl_certificate /etc/letsencrypt/live/anoook.newlecture.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anoook.newlecture.com/privkey.pem;

        # 권장 SSL 최적화 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. SSE(실시간 알림) 스트림 프록시 → Frontend (BFF)
        location /api/events/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';

            # SSE 작동을 위한 버퍼링 및 캐시 비활성화
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # 2. 모든 요청을 Frontend (Next.js - BFF 역할 포함)로 전달
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
