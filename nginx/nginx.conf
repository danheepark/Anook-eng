events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        # server_name Anook.com api.Anook.com; # 추후 실제 구매한 도메인으로 변경하세요

        client_max_body_size 10M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. SSE(실시간 알림) 스트림 프록시 → Frontend (BFF)
        # SSE는 실시간으로 데이터를 흘려보내야 하므로 Nginx 버퍼링을 반드시 꺼야 합니다.
        location /api/events/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';

            # SSE 작동을 위한 버퍼링 및 캐시 비활성화
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # 2. 모든 요청을 Frontend (Next.js - BFF 역할 포함)로 전달
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
